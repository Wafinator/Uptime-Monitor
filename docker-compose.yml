# Dev only services. Run `docker compose up -d` from this folder.
# The app itself runs on the host with npm run dev. Only Postgres and the
# fake SMTP server are containerized.

services:
  postgres:
    image: postgres:16-alpine
    container_name: uptime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uptime
      POSTGRES_PASSWORD: uptime
      POSTGRES_DB: uptime
    ports:
      # Host port is 5433 (not 5432) so Docker Postgres doesn't fight with a
      # native Postgres install on the host. Inside the container it's still 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime -d uptime"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server. Catches every alert email the app sends so I can view
  # them in dev without a real Gmail App Password. Web UI at http://localhost:8025.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: uptime-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI

volumes:
  postgres-data:
