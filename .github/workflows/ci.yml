name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    # Spin up Postgres alongside the test runner. Same image we use in dev.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uptime
          POSTGRES_PASSWORD: uptime
          POSTGRES_DB: uptime
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # In CI there's no native Postgres on the host, so 5432 is free.
      TEST_ADMIN_URL: postgres://uptime:uptime@localhost:5432/postgres
      TEST_DATABASE_URL: postgres://uptime:uptime@localhost:5432/uptime_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run test suite (unit + integration)
        run: npm test
